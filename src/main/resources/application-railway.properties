# Railway phase 1: app + MariaDB/MySQL + Qdrant only.
# Original documents are linked later through object storage, so local uploads
# should not be treated as durable runtime state in this profile.

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}

logging.file.name=${PANDORA_LOG_FILE:/tmp/pandora.log}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${PANDORA_SESSION_COOKIE_SECURE:true}

law-ai.batch.scheduler-enabled=${LAW_AI_BATCH_SCHEDULER_ENABLED:false}
law-ai.batch.auto-enabled=${LAW_AI_BATCH_AUTO_ENABLED:false}
law-ai.batch.auto-ingest-enabled=${LAW_AI_BATCH_AUTO_INGEST_ENABLED:false}
law-ai.rag.upload-root=${PANDORA_RAG_UPLOAD_ROOT:/tmp/rag-upload}

# Set these PANDORA_OBJECT_STORAGE_* variables from the Railway Bucket service
# only after the Bucket is created. Keeping this false preserves phase-1 behavior.
pandora.object-storage.enabled=${PANDORA_OBJECT_STORAGE_ENABLED:false}
pandora.object-storage.cache-root=${PANDORA_OBJECT_STORAGE_CACHE_ROOT:/tmp/pandora-object-cache}

pandora.admin-access.local-only=${PANDORA_ADMIN_LOCAL_ONLY:false}
pandora.admin-access.token=${PANDORA_ADMIN_TOKEN:}
