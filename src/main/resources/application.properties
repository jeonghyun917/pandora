spring.application.name=pandora
spring.batch.job.enabled=false

logging.file.name=logs/pandora.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14

# Optional local developer overrides. Do not commit secrets in application-local.properties.
spring.config.import=optional:classpath:application-local.properties

# Local MariaDB defaults. Production should override these through profile/env-specific config.
spring.datasource.url=jdbc:mariadb://localhost:3306/pandora?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=pandora
spring.datasource.password=pandora
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

law-ai.openai.api-key=${OPENAI_API_KEY:}
law-ai.openai.embedding-model=text-embedding-3-small
law-ai.openai.answer-model=gpt-5-mini
law-ai.openai.answer-reasoning-effort=low
law-ai.openai.answer-verbosity=low
law-ai.openai.answer-max-output-tokens=700

law-ai.qdrant.base-url=http://127.0.0.1:6333
law-ai.qdrant.collection=law_chunks
law-ai.qdrant.rag-collection=rag_chunks_v4
law-ai.qdrant.vector-size=1536

# The scheduler is disabled by default so the 8080 app-dev runtime never polls
# or ingests OpenAI Batch jobs accidentally. scripts/start-pandora.ps1 enables
# this only for the 18080 batch-runner role.
law-ai.batch.scheduler-enabled=false
law-ai.batch.auto-enabled=false
law-ai.batch.auto-ingest-enabled=true
law-ai.batch.auto-target=law
law-ai.batch.auto-query=
law-ai.batch.submit-limit=50000
law-ai.batch.max-active-jobs=2
law-ai.batch.poll-delay-millis=600000
law-ai.batch.stale-submitted-minutes=360

# schema.sql is used as an additive local bootstrap for missing tables.
spring.sql.init.mode=always

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=false

law-open-api.base-url=https://www.law.go.kr/DRF
law-open-api.oc=${LAW_OPEN_API_OC:}

law-ai.rag.upload-root=data/rag-upload
law-ai.rag.import-batch-size=64

# Admin/debug/batch control APIs are useful during development, but must not be
# exposed broadly. Local requests are allowed by default. For remote admin
# access, set PANDORA_ADMIN_TOKEN and send it as X-Pandora-Admin-Token.
pandora.admin-access.enabled=true
pandora.admin-access.local-only=true
pandora.admin-access.token=${PANDORA_ADMIN_TOKEN:}

pandora.auth.enabled=true
pandora.auth.session-timeout-seconds=43200
pandora.auth.max-failed-attempts=10
pandora.auth.lock-minutes=15
pandora.auth.bootstrap.username=${PANDORA_BOOTSTRAP_ADMIN_USERNAME:}
pandora.auth.bootstrap.password=${PANDORA_BOOTSTRAP_ADMIN_PASSWORD:}
pandora.auth.bootstrap.display-name=Pandora Admin

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PANDORA_SESSION_COOKIE_SECURE:false}
