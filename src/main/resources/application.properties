spring.application.name=pandora
spring.batch.job.enabled=false
server.port=${PORT:8080}

logging.file.name=${PANDORA_LOG_FILE:logs/pandora.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14

# Optional local developer overrides. Do not commit secrets in application-local.properties.
spring.config.import=optional:classpath:application-local.properties

# Local MariaDB defaults. Production should override these through profile/env-specific config.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:pandora}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:pandora}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:pandora}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

law-ai.openai.api-key=${OPENAI_API_KEY:}
law-ai.openai.embedding-model=text-embedding-3-small
law-ai.openai.answer-model=gpt-5-mini
law-ai.openai.answer-reasoning-effort=low
law-ai.openai.answer-verbosity=low
law-ai.openai.answer-max-output-tokens=700

law-ai.qdrant.base-url=${QDRANT_URL:http://127.0.0.1:6333}
law-ai.qdrant.collection=${QDRANT_COLLECTION:law_chunks}
law-ai.qdrant.rag-collection=${QDRANT_RAG_COLLECTION:rag_chunks_v4}
law-ai.qdrant.vector-size=1536

# The scheduler is disabled by default so the 8080 app-dev runtime never polls
# or ingests OpenAI Batch jobs accidentally. scripts/start-pandora.ps1 enables
# this only for the 18080 batch-runner role.
law-ai.batch.scheduler-enabled=false
law-ai.batch.auto-enabled=false
law-ai.batch.auto-ingest-enabled=true
law-ai.batch.auto-target=law
law-ai.batch.auto-query=
law-ai.batch.submit-limit=50000
law-ai.batch.max-active-jobs=2
law-ai.batch.poll-delay-millis=600000
law-ai.batch.stale-submitted-minutes=360

# schema.sql is used as an additive local bootstrap for missing tables.
spring.sql.init.mode=always

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=false

law-open-api.base-url=https://www.law.go.kr/DRF
law-open-api.oc=${LAW_OPEN_API_OC:}

law-ai.rag.upload-root=data/rag-upload
law-ai.rag.import-batch-size=64

# Private S3-compatible storage is off locally unless explicitly configured.
pandora.object-storage.enabled=${PANDORA_OBJECT_STORAGE_ENABLED:false}
pandora.object-storage.endpoint=${PANDORA_OBJECT_STORAGE_ENDPOINT:}
pandora.object-storage.region=${PANDORA_OBJECT_STORAGE_REGION:auto}
pandora.object-storage.bucket=${PANDORA_OBJECT_STORAGE_BUCKET:}
pandora.object-storage.access-key-id=${PANDORA_OBJECT_STORAGE_ACCESS_KEY_ID:}
pandora.object-storage.secret-access-key=${PANDORA_OBJECT_STORAGE_SECRET_ACCESS_KEY:}
pandora.object-storage.path-style=${PANDORA_OBJECT_STORAGE_PATH_STYLE:false}
pandora.object-storage.cache-root=${PANDORA_OBJECT_STORAGE_CACHE_ROOT:${java.io.tmpdir}/pandora-object-cache}
pandora.object-storage.migration.enabled=${PANDORA_OBJECT_STORAGE_MIGRATION_ENABLED:false}
pandora.object-storage.migration.mode=${PANDORA_OBJECT_STORAGE_MIGRATION_MODE:}
pandora.object-storage.migration.manifest-path=${PANDORA_OBJECT_STORAGE_MIGRATION_MANIFEST_PATH:}

law-ai.retrieval.lexical.k1=1.2
law-ai.retrieval.lexical.b=0.75
law-ai.retrieval.lexical.document-title-weight=8
law-ai.retrieval.lexical.parent-title-weight=6
law-ai.retrieval.lexical.chunk-title-weight=7
law-ai.retrieval.lexical.body-weight=1
law-ai.retrieval.lexical.max-query-terms=24
law-ai.retrieval.lexical.max-result-limit=100
law-ai.retrieval.rrf-shadow-enabled=true
law-ai.retrieval.rrf-authoritative=false
law-ai.retrieval.rrf-k=60
law-ai.retrieval.rrf-vector-weight=1.0
law-ai.retrieval.rrf-lexical-weight=1.0
law-ai.retrieval.rrf-fused-limit=100
law-ai.retrieval.coverage-aware.enabled=false
law-ai.retrieval.coverage-aware.max-rescues=0
law-ai.retrieval.coverage-aware.max-rescues-per-document=1
law-ai.retrieval.coverage-aware.source-rank-limit=30
law-ai.retrieval.document-expansion.enabled=true
law-ai.retrieval.document-expansion.authoritative=false
law-ai.retrieval.document-expansion.max-documents=3
law-ai.retrieval.document-expansion.max-chunks-per-document=8
law-ai.retrieval.document-expansion.max-total-chunks=24
law-ai.verification.semantic-shadow-enabled=true
law-ai.verification.semantic-authoritative=false
law-ai.verification.max-shadow-disagreements=20
law-ai.semantic-selection.shadow-enabled=true
law-ai.semantic-selection.authoritative=false
law-ai.semantic-selection.preserve-limit=4

# Admin/debug/batch control APIs are useful during development, but must not be
# exposed broadly. Local requests are allowed by default. For remote admin
# access, set PANDORA_ADMIN_TOKEN and send it as X-Pandora-Admin-Token.
pandora.admin-access.enabled=true
pandora.admin-access.local-only=true
pandora.admin-access.token=${PANDORA_ADMIN_TOKEN:}

pandora.auth.enabled=true
pandora.auth.session-timeout-seconds=43200
pandora.auth.max-failed-attempts=10
pandora.auth.lock-minutes=15
pandora.auth.bootstrap.username=${PANDORA_BOOTSTRAP_ADMIN_USERNAME:}
pandora.auth.bootstrap.password=${PANDORA_BOOTSTRAP_ADMIN_PASSWORD:}
pandora.auth.bootstrap.display-name=Pandora Admin

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PANDORA_SESSION_COOKIE_SECURE:false}
