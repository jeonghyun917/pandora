answer_focus.procedure=질문 의도는 절차 또는 처리 방법입니다. 신청, 제출, 검토, 통보 흐름을 순서대로 답하세요.
answer_focus.period=질문 의도는 시기, 기간 또는 기한입니다. 평가기간, 제출기한, 완료기한처럼 날짜나 기간을 직접 말하는 근거를 먼저 답하세요.
answer_focus.penalty=질문 의도는 미준수 시 불이익, 제재 또는 조치입니다. 근거에 제재 유형이나 조치가 직접 있을 때만 단정하세요.
answer_focus.project_review.target_scope=질문 의도는 과업심의 적용 대상 여부입니다. 결론에 '과업심의는 소프트웨어사업의 대상사업 여부를 기준으로 판단한다'는 점을 명시하세요.|다른 법령이나 다른 기준으로 답해도 되는지 묻는 경우, 과업심의 답변의 직접 근거는 공공소프트웨어사업 과업심의/소프트웨어사업 대상사업 근거라고 먼저 구분하세요.|상용SW 구매나 간소화 과업심의는 심의 면제와 다릅니다. 사용자가 간소화를 묻지 않았다면 간소화는 결론으로 쓰지 마세요.|단순 소프트웨어 구매라고만 묻는 경우에는 단순 H/W 비대상 조항을 그대로 확장하지 말고, 소프트웨어사업 해당 여부를 기준으로 답하세요.
answer_focus.project_review.exception_scope=질문 의도는 과업심의 예외 또는 비대상 여부입니다. 먼저 원칙적 대상 여부를 말하고, 그 다음 예외 조건을 분리하세요.
answer_focus.security_review.target_scope=질문 의도는 보안성 검토의 대상 시스템 또는 대상 사업입니다. 대상 범위, 검토 주체, 생략 대상을 구분해 먼저 답하세요.|누출금지 대상정보, AI모델 공격유형, 보안관리 항목은 보안대책/검토내용입니다. 사용자가 검토 항목을 묻지 않았다면 대상 시스템의 결론으로 쓰지 마세요.
answer_focus.security_review.security_review_required=질문 의도는 보안성 검토 필요 여부입니다. 검토 대상인지, 생략 가능한지, 별도 확인이 필요한지를 구분하세요.
answer_focus.procurement_catalog.contract_method=질문 의도는 조달청 종합쇼핑몰, 디지털서비스몰, 디지털카탈로그 구매와 계약방식의 관계입니다.|상용SW 직접구매 대상인지와 수의계약 해당 여부를 구분해 답하세요.|근거에 수의계약이라는 직접 문구가 없으면 수의계약이라고 단정하지 말고, 계약방식은 조달 품목, 금액, 구매 절차 확인이 필요하다고 말하세요.
answer_focus.procurement_catalog.purchase_channel=질문 의도는 구매 경로입니다. 조달 경로와 계약 방식 판단을 섞지 말고 분리해서 답하세요.

